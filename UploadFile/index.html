<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f4;
        }
        .upload-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        input[type="file"] {
            display: block;
            margin: 20px 0;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="upload-container">
    <h2>Upload Document</h2>
    
    <!-- 
      CRITICAL SETTINGS:
      1. method must be "post"
      2. enctype must be "multipart/form-data" 
      3. action points to your php filename (change 'upload.php' if your file name is different)
    -->
    <form action="upload.php" method="post" enctype="multipart/form-data">
        <label for="fileSelect">Select File to Upload:</label>
        
        <!-- The 'name' attribute value MUST match your PHP code: $_FILES['fileToUpload'] -->
        <input type="file" name="fileToUpload" id="fileSelect" required>
        
        <input type="submit" value="Upload File">
    </form>
    
    <div class="note">
        * Allowed formats: JPG, JPEG, PNG, PDF.<br>
        * Maximum file size: 2 MB.
    </div>
</div>

</body>
</html>
